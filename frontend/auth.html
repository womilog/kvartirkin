<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и регистрация — Квартиркинъ</title>
    <meta name="description" content="Вход в личный кабинет или регистрация на сайте Квартиркинъ.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind Config -->
    <script src="js/tailwind-config.js"></script>
    
    <!-- Стили -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">
    <div class="noise-overlay"></div>
    
    <!-- Навигация -->
    <nav class="fixed top-6 left-1/2 -translate-x-1/2 z-50">
        <div class="double-bezel">
            <div class="double-bezel-inner px-6 py-3">
                <a href="index.html" class="font-serif text-2xl font-semibold text-sand-800 tracking-tight">Квартиркинъ</a>
            </div>
        </div>
    </nav>
    
    <!-- Основной контент -->
    <main class="flex-1 flex items-center justify-center px-4 py-24">
        <div class="w-full max-w-md reveal active">
            <div class="double-bezel">
                <div class="double-bezel-inner p-8">
                    <!-- Табы -->
                    <div class="flex p-1 bg-sand-100 rounded-full mb-8">
                        <button class="tab-btn active flex-1 py-2 px-4 rounded-full text-sm font-medium" data-tab="login">Вход</button>
                        <button class="tab-btn flex-1 py-2 px-4 rounded-full text-sm font-medium text-sand-600" data-tab="register">Регистрация</button>
                    </div>
                    
                    <!-- Форма входа -->
                    <div id="login-form" class="form-section active">
                        <h1 class="font-serif text-2xl font-medium text-sand-900 mb-2">С возвращением!</h1>
                        <p class="text-sand-500 text-sm mb-6">Войдите в свой аккаунт, чтобы продолжить</p>
                        
                        <form class="space-y-4">
                            <div>
                                <label class="block text-sm text-sand-600 mb-1">Email или телефон</label>
                                <input type="text" required class="w-full px-4 py-3 rounded-lg bg-sand-50 border border-sand-200 focus:border-sea-500 focus:ring-2 focus:ring-sea-200 transition-all" placeholder="example@mail.ru">
                            </div>
                            <div>
                                <label class="block text-sm text-sand-600 mb-1">Пароль</label>
                                <div class="relative">
                                    <input type="password" required class="w-full px-4 py-3 rounded-lg bg-sand-50 border border-sand-200 focus:border-sea-500 focus:ring-2 focus:ring-sea-200 transition-all" placeholder="••••••••">
                                    <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-sand-400 hover:text-sand-600">
                                        <i class="ph ph-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="flex items-center justify-between text-sm">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" class="rounded text-sea-500 focus:ring-sea-500">
                                    <span class="text-sand-600">Запомнить меня</span>
                                </label>
                                <a href="#" class="text-sea-600 hover:underline">Забыли пароль?</a>
                            </div>
                            
                            <button type="submit" class="magnetic-btn w-full py-3 bg-sand-800 text-white rounded-full font-medium hover:bg-sand-900 transition-colors flex items-center justify-center gap-2">
                                <span>Войти</span>
                                <i class="ph ph-arrow-right"></i>
                            </button>
                        </form>
                        
                        <div class="mt-6">
                            <div class="relative">
                                <div class="absolute inset-0 flex items-center">
                                    <div class="w-full border-t border-sand-200"></div>
                                </div>
                                <div class="relative flex justify-center text-sm">
                                    <span class="px-2 bg-white text-sand-500">Или войдите через</span>
                                </div>
                            </div>
                            
                            <div class="flex gap-3 mt-4">
                                <button class="flex-1 py-2.5 border border-sand-200 rounded-full flex items-center justify-center gap-2 hover:bg-sand-50 transition-colors">
                                    <i class="ph ph-google-logo text-lg"></i>
                                    <span class="text-sm font-medium">Google</span>
                                </button>
                                <button class="flex-1 py-2.5 border border-sand-200 rounded-full flex items-center justify-center gap-2 hover:bg-sand-50 transition-colors">
                                    <i class="ph ph-vk-logo text-lg"></i>
                                    <span class="text-sm font-medium">VK</span>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Форма регистрации -->
                    <div id="register-form" class="form-section">
                        <h1 class="font-serif text-2xl font-medium text-sand-900 mb-2">Создать аккаунт</h1>
                        <p class="text-sand-500 text-sm mb-6">Зарегистрируйтесь, чтобы бронировать квартиры</p>
                        
                        <form class="space-y-4">
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm text-sand-600 mb-1">Имя</label>
                                    <input type="text" required class="w-full px-4 py-3 rounded-lg bg-sand-50 border border-sand-200 focus:border-sea-500 focus:ring-2 focus:ring-sea-200 transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm text-sand-600 mb-1">Фамилия</label>
                                    <input type="text" required class="w-full px-4 py-3 rounded-lg bg-sand-50 border border-sand-200 focus:border-sea-500 focus:ring-2 focus:ring-sea-200 transition-all">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm text-sand-600 mb-1">Email</label>
                                <input type="email" required class="w-full px-4 py-3 rounded-lg bg-sand-50 border border-sand-200 focus:border-sea-500 focus:ring-2 focus:ring-sea-200 transition-all" placeholder="example@mail.ru">
                            </div>
                            <div>
                                <label class="block text-sm text-sand-600 mb-1">Телефон</label>
                                <input type="tel" required class="w-full px-4 py-3 rounded-lg bg-sand-50 border border-sand-200 focus:border-sea-500 focus:ring-2 focus:ring-sea-200 transition-all" placeholder="+7 (___) ___-__-__">
                            </div>
                            <div>
                                <label class="block text-sm text-sand-600 mb-1">Пароль</label>
                                <div class="relative">
                                    <input type="password" required class="w-full px-4 py-3 rounded-lg bg-sand-50 border border-sand-200 focus:border-sea-500 focus:ring-2 focus:ring-sea-200 transition-all" placeholder="Минимум 8 символов">
                                    <button type="button" class="password-toggle absolute right-3 top-1/2 -translate-y-1/2 text-sand-400 hover:text-sand-600">
                                        <i class="ph ph-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <label class="flex items-start gap-2 cursor-pointer">
                                <input type="checkbox" required class="rounded text-sea-500 focus:ring-sea-500 mt-1">
                                <span class="text-xs text-sand-600">Я согласен с <a href="#" class="text-sea-600 hover:underline">условиями использования</a> и <a href="#" class="text-sea-600 hover:underline">политикой конфиденциальности</a></span>
                            </label>
                            
                            <button type="submit" class="magnetic-btn w-full py-3 bg-sand-800 text-white rounded-full font-medium hover:bg-sand-900 transition-colors flex items-center justify-center gap-2">
                                <span>Зарегистрироваться</span>
                                <i class="ph ph-arrow-right"></i>
                            </button>
                        </form>
                        
                        <div class="mt-6">
                            <div class="relative">
                                <div class="absolute inset-0 flex items-center">
                                    <div class="w-full border-t border-sand-200"></div>
                                </div>
                                <div class="relative flex justify-center text-sm">
                                    <span class="px-2 bg-white text-sand-500">Или через</span>
                                </div>
                            </div>
                            
                            <div class="flex gap-3 mt-4">
                                <button class="flex-1 py-2.5 border border-sand-200 rounded-full flex items-center justify-center gap-2 hover:bg-sand-50 transition-colors">
                                    <i class="ph ph-google-logo text-lg"></i>
                                    <span class="text-sm font-medium">Google</span>
                                </button>
                                <button class="flex-1 py-2.5 border border-sand-200 rounded-full flex items-center justify-center gap-2 hover:bg-sand-50 transition-colors">
                                    <i class="ph ph-vk-logo text-lg"></i>
                                    <span class="text-sm font-medium">VK</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <p class="text-center text-sm text-sand-500 mt-6">
                Нужна помощь? <a href="#" class="text-sea-600 hover:underline">Свяжитесь с нами</a>
            </p>
        </div>
    </main>
    
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Табы
            const tabBtns = document.querySelectorAll('.tab-btn');
            const formSections = document.querySelectorAll('.form-section');
            
            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const tab = btn.dataset.tab;
                    
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    formSections.forEach(section => {
                        section.classList.remove('active');
                        if (section.id === tab + '-form') {
                            section.classList.add('active');
                        }
                    });
                });
            });
            
            // Показать/скрыть пароль
            document.querySelectorAll('.password-toggle').forEach(btn => {
                btn.addEventListener('click', function() {
                    const input = this.previousElementSibling;
                    const icon = this.querySelector('i');
                    
                    if (input.type === 'password') {
                        input.type = 'text';
                        icon.classList.replace('ph-eye', 'ph-eye-slash');
                    } else {
                        input.type = 'password';
                        icon.classList.replace('ph-eye-slash', 'ph-eye');
                    }
                });
            });
        });
    </script>
</body>
</html>
